<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 学习计划</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/np-accent.js"></script>
<script src="assets/np-data.js"></script>
<style>
  /* ============================================================
     学习计划 · DESIGN.md 2.0（新密度）
     - 侧栏 252px，导航 34px / 13.5px / 图标 18px
     - 主按钮 ink1 矩形 8px；粉色只给她和学习本身
     - 层级 = 表面阶梯 + 发丝线；数字 tabular-nums
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); overflow: hidden;
    -webkit-font-smoothing: antialiased;
    background: #EDF0F4; display: grid; place-items: center;
    color: var(--tInk1);
  }
  button { font-family: inherit; }
  [hidden] { display: none !important; }
  ::selection { background: var(--tPrimarySoft); }

  /* ================= 窗口 ================= */
  .app-window {
    width: min(1280px, 92vw); height: min(830px, 88vh);
    background: var(--surface-0);
    border-radius: 16px; border: 1px solid rgba(24,28,35,.09);
    box-shadow: var(--shadow-window);
    display: flex; overflow: hidden;
  }

  /* ================= 侧栏（252px · 与主页一致） ================= */
  .sidebar {
    width: 252px; flex-shrink: 0;
    background: var(--surface-1);
    border-right: 1px solid rgba(24,28,35,.06);
    display: flex; flex-direction: column;
  }
  .traffic { display: flex; align-items: center; gap: 8px; padding: 16px 18px 12px; }
  .traffic span.dot { width: 12px; height: 12px; border-radius: 50%; }
  .traffic .r { background: #FF5F57; } .traffic .y { background: #FEBC2E; } .traffic .g { background: #28C840; }
  /* macOS 细节：hover 红绿灯显示 × – + 字形 */
  .traffic .r, .traffic .y, .traffic .g { position: relative; cursor: pointer; }
  .traffic .r::after, .traffic .y::after, .traffic .g::after {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 9px; font-weight: 700; line-height: 1;
    color: rgba(0,0,0,.45); opacity: 0; transition: opacity .12s;
  }
  .traffic .r::after { content: "\00D7"; }
  .traffic .y::after { content: "\2013"; }
  .traffic .g::after { content: "+"; }
  .traffic:hover .r::after, .traffic:hover .y::after, .traffic:hover .g::after { opacity: 1; }

  .back-link {
    display: flex; align-items: center; gap: 7px;
    height: 33px; margin: 0 14px 2px; padding: 0 12px; border-radius: 9px;
    color: var(--tInk2); font-size: 13.5px; font-weight: 500; text-decoration: none;
    transition: background .15s;
  }
  .back-link:hover { background: rgba(255,255,255,.65); color: var(--tInk1); }
  .side-scroll { flex: 1; overflow-y: auto; padding: 4px 14px 14px; }
  .side-scroll::-webkit-scrollbar { width: 0; }
  .group-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    color: var(--tInk3); padding: 16px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    height: 34px; padding: 0 12px; border-radius: 9px;
    font-size: 13.5px; color: var(--tInk2); text-decoration: none;
    transition: background .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.65); color: var(--tInk1); }
  .nav-item svg { color: var(--tInk3); flex-shrink: 0; width: 18px; height: 18px; }
  .nav-item.active { background: #fff; color: var(--tInk1); font-weight: 600; box-shadow: var(--shadow-sm); }
  .nav-item.active svg { color: var(--tInk2); }
  .nav-item .cnt { margin-left: auto; font-size: 10.5px; color: var(--tInk3); font-variant-numeric: tabular-nums; }

  /* ---------- 侧栏图标微动效（与主页同一套） ---------- */
  .back-link svg { transition: transform .2s ease-out; }
  .back-link:hover svg { transform: translateX(-2.5px); }
  .nav-item .ic-hand { transform-box: view-box; transform-origin: 12px 12px; }
  .nav-item:hover .ic-hand { animation: icSpin .9s cubic-bezier(.3,1.3,.4,1); }
  @keyframes icSpin { to { transform: rotate(720deg); } }
  .nav-item[href="lib.html"]:hover svg { animation: icTilt .55s cubic-bezier(.34,1.5,.64,1); }
  @keyframes icTilt { 45% { transform: rotate(-13deg) translateY(-1.5px); } }
  .nav-item[href="map.html"] svg circle { transform-box: fill-box; transform-origin: center; }
  .nav-item[href="map.html"]:hover svg circle { animation: icPulse .8s cubic-bezier(.34,1.56,.64,1); }
  .nav-item[href="map.html"]:hover svg circle:nth-of-type(2) { animation-delay: .08s; }
  .nav-item[href="map.html"]:hover svg circle:nth-of-type(3) { animation-delay: .16s; }
  .nav-item[href="map.html"]:hover svg circle:nth-of-type(4) { animation-delay: .24s; }
  @keyframes icPulse { 45% { transform: scale(1.75); } }
  .nav-item .ic-line { transform-box: fill-box; transform-origin: left center; }
  .nav-item:hover .ic-line { animation: icWrite .6s cubic-bezier(.22,1,.36,1); }
  @keyframes icWrite { from { transform: scaleX(0); } }
  .nav-item[href="memory.html"] svg { transform-box: fill-box; transform-origin: center;
    animation: icTwinkle 3s ease-in-out infinite; }
  @keyframes icTwinkle { 50% { transform: scale(1.22) rotate(11deg); opacity: .65; } }
  .nav-item .ic-dev { transform-box: fill-box; transform-origin: center; }
  .nav-item:hover .ic-dev { animation: icPair 1s ease-out; }
  @keyframes icPair { 30%, 70% { opacity: .25; transform: translateX(-2px); } }

  /* ================= 主区 ================= */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface-0); }
  .titlebar { height: 46px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; position: relative; }
  .titlebar .app-title { position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 12.5px; font-weight: 600; color: var(--tInk3); letter-spacing: .02em; }
  .titlebar .sp { flex: 1; }

  /* 按钮纪律：主按钮 ink1 矩形 8px；粉色只给她的动作 */
  .btn-primary {
    height: 36px; padding: 0 16px; border: 0; border-radius: 8px;
    background: var(--tInk1); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: #2A303B; }
  .btn-her {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 13px; border: 0; border-radius: 8px;
    background: var(--tPrimary); color: #FFF9FB; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .15s var(--ease-spring);
  }
  .btn-her:hover { background: #D05A88; }
  .btn-her:active { transform: scale(.96); }

  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 0; }
  .inner { width: min(880px, 100% - 80px); margin: 0 auto; padding: 20px 0 48px; }

  /* ---------- 页头 ---------- */
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .page-title { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .page-sub { font-size: 12px; color: var(--tInk3); font-variant-numeric: tabular-nums; }
  /* 连续天数：她的存在，允许粉 */
  .streak-chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 10px; border-radius: 999px;
    background: var(--tPrimarySoft); color: var(--tPrimary);
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .head-sp { flex: 1; }
  .week-done { font-size: 11.5px; color: var(--tInk3); font-variant-numeric: tabular-nums; }

  /* ---------- 本周视图：7 列 · L2 白卡 + 发丝线 · today = 顶部 2.5px ink1 指示条 ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
  .day {
    position: relative;
    background: var(--surface-2); border: 1px solid rgba(24,28,35,.07);
    border-radius: 12px; box-shadow: var(--shadow-sm);
    padding: 11px 10px 12px; min-height: 128px;
    transition: border-color .15s;
  }
  .day:hover { border-color: rgba(24,28,35,.15); }
  .day.today { border-color: rgba(24,28,35,.16); }
  .day.today::before {
    content: ""; position: absolute; top: -1px; left: 12px; right: 12px;
    height: 2.5px; border-radius: 2px; background: var(--tInk1);
  }
  .d-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
  .d-name { font-size: 10px; font-weight: 600; letter-spacing: .09em; color: var(--tInk3); }
  .d-num { font-size: 15px; font-weight: 600; color: var(--tInk2); font-variant-numeric: tabular-nums; }
  .day.today .d-num { color: var(--tInk1); }
  .block {
    font-size: 11.5px; line-height: 1.45; padding: 5px 8px; border-radius: 7px;
    background: var(--surface-0); border: 1px solid rgba(24,28,35,.06);
    color: var(--tInk2); margin-bottom: 5px;
    transition: border-color .15s, color .15s;
  }
  .block:hover { border-color: rgba(24,28,35,.14); color: var(--tInk1); }
  .block.done { color: var(--tInk3); text-decoration: line-through; }
  .block.done:hover { color: var(--tInk2); }
  .d-foot { position: absolute; bottom: 8px; left: 10px; right: 10px;
    font-size: 10px; color: var(--tInk3); font-variant-numeric: tabular-nums; }

  /* ---------- 今日卡：她的主场 ---------- */
  .today-card {
    background: var(--surface-2); border: 1px solid rgba(24,28,35,.07);
    border-radius: 14px; box-shadow: var(--shadow-sm);
    overflow: hidden; margin-bottom: 16px;
  }
  .today-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
  .today-label { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .today-meta { font-size: 11.5px; color: var(--tInk3); font-variant-numeric: tabular-nums; }
  .today-head .sp { flex: 1; }
  /* 今日进度：学习本身，允许粉 */
  .today-prog { height: 3px; margin: 2px 18px 4px; border-radius: 2px;
    background: rgba(24,28,35,.06); overflow: hidden; }
  .today-prog i { display: block; height: 100%; border-radius: 2px;
    background: var(--tPrimary); width: 0; transition: width .35s var(--ease-out); }

  .todo { display: flex; align-items: center; gap: 12px; padding: 12px 18px; cursor: pointer;
    transition: background .15s; }
  .todo:hover { background: rgba(24,28,35,.025); }
  .todo + .todo { border-top: 1px solid rgba(24,28,35,.05); }
  .todo .cb {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid rgba(24,28,35,.16);
    display: grid; place-items: center; color: transparent;
    transition: all .18s var(--ease-out);
  }
  /* 勾选瞬间：勾子弹出（弹性只给她的反馈） */
  .todo.done .cb { background: var(--tSuccess); border-color: var(--tSuccess); color: #fff;
    animation: cbPop .3s var(--ease-spring); }
  @keyframes cbPop { 40% { transform: scale(1.25); } }
  .todo:hover .cb { border-color: rgba(24,28,35,.34); }
  .todo.done .cb { background: var(--tSuccess); border-color: var(--tSuccess); color: #fff; }
  .todo .t { font-size: 13.5px; font-weight: 500; }
  .todo .m { font-size: 11.5px; color: var(--tInk3); margin-top: 1px; }
  .todo.done .t { color: var(--tInk3); text-decoration: line-through; }
  .todo .dur { margin-left: auto; font-size: 11.5px; color: var(--tInk3);
    font-variant-numeric: tabular-nums; flex-shrink: 0; }
  /* 「开始」= 她的引导，用粉色文字链 */
  .todo .go { font-size: 11.5px; font-weight: 600; color: var(--tPrimary);
    text-decoration: none; flex-shrink: 0; }
  .todo .go:hover { text-decoration: underline; }

  /* 全部完成：庆祝，允许粉 */
  .today-prog.all-done i { background: var(--tPrimary); }
  .today-meta.all-done { color: var(--tPrimary); font-weight: 600; }

  /* ---------- 空态：诚实、安静、她来接管 ---------- */
  .plan-empty { padding: 30px 18px 32px; text-align: center; }
  .plan-empty .pe-ic { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 12px;
    background: var(--tPrimarySoft); color: var(--tPrimary);
    display: grid; place-items: center; }
  .plan-empty .pe-t { font-size: 13.5px; font-weight: 600; color: var(--tInk1); margin-bottom: 4px; }
  .plan-empty .pe-s { font-size: 11.5px; color: var(--tInk3); margin-bottom: 16px; }

  /* ---------- 添加行：矩形输入 + ink1 主按钮 ---------- */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; height: 36px; padding: 0 13px;
    border: 1px solid rgba(24,28,35,.1); border-radius: 8px;
    background: var(--surface-2);
    font-family: inherit; font-size: 13px; color: var(--tInk1); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-row input::placeholder { color: var(--tInk3); }
  .add-row input:focus { border-color: rgba(224,107,151,.5); box-shadow: 0 0 0 3px rgba(224,107,151,.12); }
  /* 加入按钮状态感知：空 = 中性禁用，有字 = ink1 可点 */
  .add-row .btn-primary:disabled { background: var(--surface-1); color: var(--tInk3); cursor: default; }
  .add-row .btn-primary:not(:disabled):active { transform: scale(.97); }
  .add-row .btn-primary { transition: background .15s, transform .15s ease-out; }
  /* 输入框快捷键提示 */
  .add-wrap { position: relative; flex: 1; display: flex; }
  .add-wrap input { flex: 1; }
  .add-wrap .kbd-hint {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    pointer-events: none; opacity: .85;
  }
  .add-wrap:focus-within .kbd-hint, .add-wrap.has-text .kbd-hint { opacity: 0; }
</style>
</head>
<body>
<div class="app-window">

  <!-- ============ 侧栏（与主页一致 · 252px） ============ -->
  <aside class="sidebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <a class="back-link" href="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      返回首页
    </a>
    <div class="side-scroll">
      <div class="group-label">学习</div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        学习计划<span class="cnt" id="planCnt" hidden></span>
      </div>
      <a class="nav-item" href="mistakes.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path class="ic-hand" d="M12 7v5l3 3"/></svg>
        错题本
      </a>
      <a class="nav-item" href="lib.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        知识库
      </a>
      <a class="nav-item" href="map.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6.7 6.4 9.8 9.7M17.4 7.4l-3.2 2.9M7.4 17.6l2.9-3.2"/></svg>
        知识地图
      </a>
      <a class="nav-item" href="report.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path class="ic-line" d="M8 9h8"/><path class="ic-line" d="M8 13h5"/></svg>
        她的周报
      </a>
      <a class="nav-item" href="memory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
        她的记忆
      </a>
      <div class="group-label">互联</div>
      <a class="nav-item" href="drop.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="13" height="9" rx="1.5"/><path d="M6 17h5"/><rect class="ic-dev" x="16" y="9" width="6" height="11" rx="1.5"/></svg>
        设备互联
      </a>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <section class="main">
    <div class="titlebar">
      <span class="app-title">学习计划</span>
      <span class="sp"></span>
      <button class="btn-her" id="askNeko">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
        让 Neko 排下周
      </button>
    </div>

    <div class="scroll"><div class="inner">
      <div class="page-head">
        <div class="page-title">本周计划</div>
        <div class="page-sub" id="weekRange"></div>
        <span class="streak-chip" id="streakChip" hidden>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a7 7 0 0 1-7-7c0-2 .8-3.6 1.7-5C8 12 9 13.5 10.5 14c-1-2.5-.5-5 1.5-8 1 4 6 5.5 6 10a7 7 0 0 1-7 7z"/></svg>
          连续 <span id="streakNum"></span> 天
        </span>
        <span class="head-sp"></span>
        <span class="week-done" id="weekDone" hidden></span>
      </div>

      <div class="week" id="week"></div>

      <!-- 今日卡：标签 + 进度条 + 清单，一体的她的主场 -->
      <div class="today-card">
        <div class="today-head">
          <span class="today-label">今天</span>
          <span class="today-meta" id="todayMeta"></span>
          <span class="sp"></span>
          <span class="today-meta" id="todayProg" hidden></span>
        </div>
        <div class="today-prog" id="todayProgBar" hidden><i></i></div>
        <div id="todayWrap">
          <div id="todayList" hidden></div>
          <div class="plan-empty" id="todayEmpty" hidden>
            <span class="pe-ic">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
            </span>
            <div class="pe-t">今天还没有安排</div>
            <div class="pe-s">自己加一项，或者让她帮你排</div>
            <button class="btn-her" id="planForMe">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
              让她帮我排今天
            </button>
          </div>
        </div>
      </div>

      <div class="add-row">
        <div class="add-wrap">
          <input id="addInput" placeholder="加一项，比如：睡前读 20 页书">
          <span class="kbd-hint np-kbd">/</span>
        </div>
        <button class="btn-primary" id="addBtn" disabled>加入今天</button>
      </div>
    </div></div>
  </section>
</div>

<script>
  /* ================= 渲染：全部来自 NPD，无数据 = 诚实空态 ================= */
  const CHECK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function renderWeek() {
    const { days } = NPD.getWeekPlan();
    const week = document.getElementById("week");
    week.innerHTML = days.map(d => {
      const doneN = d.blocks.filter(b => b.done).length;
      return `
      <div class="day${d.isToday ? " today" : ""}">
        <div class="d-head">
          <span class="d-name">${d.name}</span>
          <span class="d-num">${d.date}</span>
        </div>
        ${d.blocks.map(b => `<div class="block${b.done ? " done" : ""}">${b.title}</div>`).join("")}
        ${d.blocks.length ? `<div class="d-foot">${doneN}/${d.blocks.length}</div>` : ""}
      </div>`;
    }).join("");

    /* 周日期范围 + 周完成统计 */
    const first = days[0], last = days[6];
    document.getElementById("weekRange").textContent =
      `${first.month} 月 ${first.date} 日 – ${last.month} 月 ${last.date} 日`;
    const all = days.flatMap(d => d.blocks);
    const doneAll = all.filter(b => b.done).length;
    const wd = document.getElementById("weekDone");
    if (all.length) { wd.textContent = `本周已完成 ${doneAll}/${all.length}`; wd.hidden = false; }
    else wd.hidden = true;

    /* 今天的日期元信息 */
    const today = days.find(d => d.isToday);
    if (today) document.getElementById("todayMeta").textContent = `${today.name} · ${today.month} 月 ${today.date} 日`;
  }

  function renderToday() {
    const items = NPD.getTodayPlan().items;
    const list = document.getElementById("todayList");
    const empty = document.getElementById("todayEmpty");
    const planCnt = document.getElementById("planCnt");
    const progText = document.getElementById("todayProg");
    const progBar = document.getElementById("todayProgBar");

    if (!items.length) {
      list.hidden = true; empty.hidden = false;
      planCnt.hidden = true; progText.hidden = true; progBar.hidden = true;
      return;
    }
    empty.hidden = true; list.hidden = false;

    const doneN = items.filter(t => t.done).length;
    const allDone = doneN === items.length;
    progText.textContent = allDone ? "今天搞定啦" : `${doneN}/${items.length} 完成`;
    progText.classList.toggle("all-done", allDone);
    progBar.classList.toggle("all-done", allDone);
    progText.hidden = false;
    progBar.hidden = false;
    progBar.firstElementChild.style.width = (doneN / items.length * 100) + "%";
    planCnt.textContent = `${doneN}/${items.length}`;
    planCnt.hidden = false;

    list.innerHTML = items.map(td => `
      <div class="todo${td.done ? " done" : ""}" data-id="${td.id}">
        <span class="cb">${CHECK}</span>
        <div><div class="t">${td.title}</div>${td.meta ? `<div class="m">${td.meta}</div>` : ""}</div>
        ${td.durationMin ? `<span class="dur">${td.durationMin} 分钟</span>` : ""}
        ${!td.done && td.href ? `<a class="go" href="${td.href}" onclick="event.stopPropagation()">开始 →</a>` : ""}
      </div>`).join("");
    list.querySelectorAll(".todo").forEach(el =>
      el.addEventListener("click", () => NPD.toggleTodayItem(el.dataset.id)));
  }

  function renderStreak() {
    const streak = NPD.getStreak();
    const chip = document.getElementById("streakChip");
    if (streak != null) {
      document.getElementById("streakNum").textContent = streak;
      chip.hidden = false;
    } else chip.hidden = true;
  }

  function renderAll() { renderWeek(); renderToday(); renderStreak(); }
  NPD.onChange(renderAll);
  renderAll();

  /* ---------- 添加 ---------- */
  const addInput = document.getElementById("addInput");
  const addBtn = document.getElementById("addBtn");
  const addWrap = addInput.closest(".add-wrap");
  /* 按钮状态感知 + "/" 键帽提示随输入隐去 */
  const syncAdd = () => {
    const has = !!addInput.value.trim();
    addBtn.disabled = !has;
    addWrap.classList.toggle("has-text", has);
  };
  addInput.addEventListener("input", syncAdd);
  syncAdd();
  addBtn.addEventListener("click", () => {
    NPD.addTodayItem(addInput.value);
    addInput.value = "";
    syncAdd();
    addInput.focus();
  });
  addInput.addEventListener("keydown", e => {
    if (e.key === "Enter") addBtn.click();
    if (e.key === "Escape") { addInput.value = ""; syncAdd(); addInput.blur(); }
  });
  /* 按 / 快速聚焦添加框 */
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== addInput) {
      e.preventDefault();
      addInput.focus();
    }
  });

  /* ---------- 她的动作：跳转学习流程（原型跳转，接真后端后由数据驱动） ---------- */
  document.getElementById("askNeko").addEventListener("click", () => location.href = "learn-flow.html");
  document.getElementById("planForMe").addEventListener("click", () => location.href = "learn-flow.html");
</script>
</body>
</html>
