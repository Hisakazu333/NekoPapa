<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 学习计划</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/np-accent.js"></script>
<script src="assets/np-data.js"></script>
<style>
  /* ============================================================
     学习计划 · DESIGN.md 2.0
     - 主按钮 ink1 矩形 8px；粉色只给她的动作
     - 层级 = 表面阶梯 + 发丝线，不用重阴影
     - 数字 tabular-nums，标题负字距
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); overflow: hidden;
    -webkit-font-smoothing: antialiased;
    background: #EDF0F4; display: grid; place-items: center;
    color: var(--tInk1);
  }
  button { font-family: inherit; }
  ::selection { background: var(--tPrimarySoft); }

  /* ================= 窗口 ================= */
  .app-window {
    width: min(1280px, 92vw); height: min(830px, 88vh);
    background: var(--surface-0);
    border-radius: 16px; border: 1px solid rgba(24,28,35,.09);
    box-shadow: var(--shadow-window);
    display: flex; overflow: hidden;
  }

  /* ================= 侧栏（与主页一致：216px · L1 · 发丝线） ================= */
  .sidebar {
    width: 216px; flex-shrink: 0;
    background: var(--surface-1);
    border-right: 1px solid rgba(24,28,35,.06);
    display: flex; flex-direction: column;
  }
  .traffic { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
  .traffic span.dot { width: 12px; height: 12px; border-radius: 50%; }
  .traffic .r { background: #FF5F57; } .traffic .y { background: #FEBC2E; } .traffic .g { background: #28C840; }
  .back-link {
    display: flex; align-items: center; gap: 6px;
    height: 28px; margin: 0 12px 2px; padding: 0 10px; border-radius: 8px;
    color: var(--tInk2); font-size: 12.5px; font-weight: 500; text-decoration: none;
    transition: background .15s;
  }
  .back-link:hover { background: rgba(255,255,255,.65); color: var(--tInk1); }
  .side-scroll { flex: 1; overflow-y: auto; padding: 2px 12px 12px; }
  .side-scroll::-webkit-scrollbar { width: 0; }
  .group-label {
    font-size: 10px; font-weight: 600; letter-spacing: .09em;
    color: var(--tInk3); padding: 14px 10px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    height: 28px; padding: 0 10px; border-radius: 8px;
    font-size: 12.5px; color: var(--tInk2); text-decoration: none;
    transition: background .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.65); color: var(--tInk1); }
  .nav-item svg { color: var(--tInk3); flex-shrink: 0; }
  .nav-item.active { background: #fff; color: var(--tInk1); font-weight: 600; box-shadow: var(--shadow-sm); }
  .nav-item.active svg { color: var(--tInk2); }
  .nav-item .cnt { margin-left: auto; font-size: 10px; color: var(--tInk3); font-variant-numeric: tabular-nums; }

  /* ================= 主区 ================= */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface-0); }
  .titlebar { height: 46px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; position: relative; }
  .titlebar .app-title { position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 12.5px; font-weight: 600; color: var(--tInk3); letter-spacing: .02em; }
  .titlebar .sp { flex: 1; }

  /* 按钮纪律：主按钮 ink1 矩形 8px；粉色只给她的动作 */
  .btn-primary {
    height: 30px; padding: 0 14px; border: 0; border-radius: 8px;
    background: var(--tInk1); color: #fff; font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: #2A303B; }
  .btn-her {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 13px; border: 0; border-radius: 8px;
    background: var(--tPrimary); color: #FFF9FB; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-her:hover { background: #D05A88; }

  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 0; }
  .inner { width: min(860px, 100% - 80px); margin: 0 auto; padding: 18px 0 48px; }

  /* ---------- 页头 ---------- */
  .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .page-title { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  .page-sub { font-size: 12px; color: var(--tInk3); font-variant-numeric: tabular-nums; }

  /* ---------- 本周视图：7 列 · L2 白卡 + 发丝线 · today = 顶部 2.5px ink1 指示条 ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 26px; }
  .day {
    position: relative;
    background: var(--surface-2); border: 1px solid rgba(24,28,35,.07);
    border-radius: 12px; box-shadow: var(--shadow-sm);
    padding: 10px 10px 12px; min-height: 116px;
  }
  .day.today { border-color: rgba(24,28,35,.14); }
  .day.today::before {
    content: ""; position: absolute; top: -1px; left: 12px; right: 12px;
    height: 2.5px; border-radius: 2px; background: var(--tInk1);
  }
  .d-name { font-size: 10px; font-weight: 600; letter-spacing: .09em; color: var(--tInk3); margin-bottom: 1px; }
  .d-num { font-size: 13px; font-weight: 600; color: var(--tInk2);
    font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .day.today .d-num { color: var(--tInk1); }
  .block {
    font-size: 11px; line-height: 1.45; padding: 5px 8px; border-radius: 7px;
    background: var(--surface-0); border: 1px solid rgba(24,28,35,.06);
    color: var(--tInk2); margin-bottom: 5px;
  }
  .block.done { color: var(--tInk3); text-decoration: line-through; }

  /* ---------- 分组标签 ---------- */
  .sec-label { font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    color: var(--tInk3); margin: 0 2px 8px; }

  /* ---------- 今日清单：高密度行 · L2 卡片 ---------- */
  .rows {
    background: var(--surface-2); border: 1px solid rgba(24,28,35,.07);
    border-radius: 12px; box-shadow: var(--shadow-sm);
    overflow: hidden; margin-bottom: 14px;
  }
  .todo { display: flex; align-items: center; gap: 11px; padding: 10px 16px; cursor: pointer; }
  .todo + .todo { border-top: 1px solid rgba(24,28,35,.05); }
  .todo .cb {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid rgba(24,28,35,.16);
    display: grid; place-items: center; color: transparent;
    transition: all .18s var(--ease-out);
  }
  .todo:hover .cb { border-color: rgba(24,28,35,.3); }
  .todo.done .cb { background: var(--tSuccess); border-color: var(--tSuccess); color: #fff; }
  .todo .t { font-size: 13px; font-weight: 500; }
  .todo .m { font-size: 11px; color: var(--tInk3); margin-top: 1px; }
  .todo.done .t { color: var(--tInk3); text-decoration: line-through; }
  .todo .dur { margin-left: auto; font-size: 11px; color: var(--tInk3);
    font-variant-numeric: tabular-nums; flex-shrink: 0; }
  /* 「开始」= 她的引导，用粉色文字链 */
  .todo .go { font-size: 11px; font-weight: 600; color: var(--tPrimary);
    text-decoration: none; flex-shrink: 0; }
  .todo .go:hover { text-decoration: underline; }

  /* ---------- 空态：诚实、安静 ---------- */
  .plan-empty { padding: 34px 0 30px; text-align: center; }
  .plan-empty .pe-t { font-size: 13px; font-weight: 500; color: var(--tInk2); margin-bottom: 4px; }
  .plan-empty .pe-s { font-size: 11.5px; color: var(--tInk3); margin-bottom: 16px; }

  /* ---------- 添加行：矩形输入 + ink1 主按钮 ---------- */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; height: 32px; padding: 0 12px;
    border: 1px solid rgba(24,28,35,.1); border-radius: 8px;
    background: var(--surface-2);
    font-family: inherit; font-size: 12.5px; color: var(--tInk1); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-row input::placeholder { color: var(--tInk3); }
  .add-row input:focus { border-color: rgba(224,107,151,.5); box-shadow: 0 0 0 3px rgba(224,107,151,.12); }
</style>
</head>
<body>
<div class="app-window">

  <!-- ============ 侧栏（与主页一致） ============ -->
  <aside class="sidebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <a class="back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      返回首页
    </a>
    <div class="side-scroll">
      <div class="group-label">学习</div>
      <div class="nav-item active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        学习计划<span class="cnt" id="planCnt" hidden></span>
      </div>
      <a class="nav-item" href="mistakes.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        错题本
      </a>
      <a class="nav-item" href="lib.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        知识库
      </a>
      <a class="nav-item" href="map.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6.7 6.4 9.8 9.7M17.4 7.4l-3.2 2.9M7.4 17.6l2.9-3.2"/></svg>
        知识地图
      </a>
      <a class="nav-item" href="report.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        她的周报
      </a>
      <a class="nav-item" href="memory.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
        她的记忆
      </a>
      <div class="group-label">互联</div>
      <a class="nav-item" href="drop.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="13" height="9" rx="1.5"/><path d="M6 17h5"/><rect x="16" y="9" width="6" height="11" rx="1.5"/></svg>
        设备互联
      </a>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <section class="main">
    <div class="titlebar">
      <span class="app-title">学习计划</span>
      <span class="sp"></span>
      <button class="btn-her" id="askNeko">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
        让 Neko 排下周
      </button>
    </div>

    <div class="scroll"><div class="inner">
      <div class="page-head">
        <div class="page-title">本周计划</div>
        <div class="page-sub" id="weekSub" hidden></div>
      </div>

      <div class="week" id="week"></div>

      <div class="sec-label">今天</div>
      <div id="todayWrap">
        <div class="rows" id="todayList" hidden></div>
        <div class="plan-empty" id="todayEmpty" hidden>
          <div class="pe-t">今天还没有安排</div>
          <div class="pe-s">自己加一项，或者让她帮你排</div>
          <button class="btn-her" id="planForMe">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.9 5.4L19.5 10l-5.6 1.6L12 17l-1.9-5.4L4.5 10l5.6-1.6z"/></svg>
            让她帮我排今天
          </button>
        </div>
      </div>

      <div class="add-row">
        <input id="addInput" placeholder="加一项，比如：睡前读 20 页书">
        <button class="btn-primary" id="addBtn">加入今天</button>
      </div>
    </div></div>
  </section>
</div>

<script>
  /* ================= 渲染：全部来自 NPD，无数据 = 诚实空态 ================= */
  const CHECK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>';

  function renderWeek() {
    const { days } = NPD.getWeekPlan();
    const week = document.getElementById("week");
    week.innerHTML = days.map(d => `
      <div class="day${d.isToday ? " today" : ""}">
        <div class="d-name">${d.name}</div>
        <div class="d-num">${d.date}</div>
        ${d.blocks.map(b => `<div class="block${b.done ? " done" : ""}">${b.title}</div>`).join("")}
      </div>`).join("");
  }

  function renderToday() {
    const items = NPD.getTodayPlan().items;
    const list = document.getElementById("todayList");
    const empty = document.getElementById("todayEmpty");
    const sub = document.getElementById("weekSub");
    const planCnt = document.getElementById("planCnt");

    if (!items.length) {
      list.hidden = true; empty.hidden = false;
      sub.hidden = true; planCnt.hidden = true;
      return;
    }
    empty.hidden = true; list.hidden = false;

    const doneN = items.filter(t => t.done).length;
    sub.textContent = `已完成 ${doneN} / ${items.length} 项`;
    sub.hidden = false;
    planCnt.textContent = `${doneN}/${items.length}`;
    planCnt.hidden = false;

    list.innerHTML = items.map(td => `
      <div class="todo${td.done ? " done" : ""}" data-id="${td.id}">
        <span class="cb">${CHECK}</span>
        <div><div class="t">${td.title}</div>${td.meta ? `<div class="m">${td.meta}</div>` : ""}</div>
        ${td.durationMin ? `<span class="dur">${td.durationMin} 分钟</span>` : ""}
        ${!td.done && td.href ? `<a class="go" href="${td.href}" onclick="event.stopPropagation()">开始 →</a>` : ""}
      </div>`).join("");
    list.querySelectorAll(".todo").forEach(el =>
      el.addEventListener("click", () => NPD.toggleTodayItem(el.dataset.id)));
  }

  function renderAll() { renderWeek(); renderToday(); }
  NPD.onChange(renderAll);
  renderAll();

  /* ---------- 添加 ---------- */
  const addInput = document.getElementById("addInput");
  document.getElementById("addBtn").addEventListener("click", () => {
    NPD.addTodayItem(addInput.value);
    addInput.value = "";
    addInput.focus();
  });
  addInput.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("addBtn").click();
  });

  /* ---------- 她的动作：跳转学习流程（原型跳转，接真后端后由数据驱动） ---------- */
  document.getElementById("askNeko").addEventListener("click", () => location.href = "learn-flow.html");
  document.getElementById("planForMe").addEventListener("click", () => location.href = "learn-flow.html");
</script>
</body>
</html>
