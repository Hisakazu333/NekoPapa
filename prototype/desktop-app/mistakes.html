<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 错题本</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/np-accent.js"></script>
<script src="assets/np-state.js"></script>
<style>
  :root {
    --tPageBg:#F5F7FA; --tCardBg:#FFFFFF; --tInk1:#181C23; --tInk2:#4E5763; --tInk3:#7A8492;
    --tBorder:#E1E7EF; --tPrimary:#E06B97; --tPrimarySoft:#F8DDE7;
    --tDanger:#E0646E; --tSuccess:#4FAF73;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --shadow-card:0 2px 10px rgba(24,28,35,0.06);
    --font:-apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased;
    background: #EDF0F4;
    display:grid; place-items:center;
  }
  button { font-family:inherit; }
  .app-window {
    width:min(1280px,92vw); height:min(830px,88vh);
    background:var(--surface-0); border-radius:16px;
    border:1px solid rgba(24,28,35,.08);
    box-shadow:0 12px 32px rgba(24,28,35,.10), 0 48px 120px rgba(24,28,35,.16);
    display:flex; overflow:hidden;
  }
  .sidebar { width:216px; flex-shrink:0; background:var(--surface-1);
    border-right:1px solid var(--tBorder); display:flex; flex-direction:column; }
  .traffic { display:flex; gap:8px; padding:14px 16px 12px; }
  .traffic span.dot { width:12px; height:12px; border-radius:50%; }
  .traffic .r{background:#FF5F57} .traffic .y{background:#FEBC2E} .traffic .g{background:#28C840}
  .back-link { display:flex; align-items:center; gap:6px; margin:0 14px 8px;
    height:28px; padding:0 10px; border-radius:var(--r-sm);
    color:var(--tInk2); font-size:12.5px; font-weight:500; text-decoration:none; }
  .back-link:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .group-label { font-size:10px; font-weight:600; letter-spacing:.09em; color:var(--tInk3); padding:14px 12px 5px; }
  .side-scroll { flex:1; overflow-y:auto; padding:4px 16px 12px; }
  .conv { display:flex; align-items:center; height:28px; padding:0 10px; margin:1px 0;
    border-radius:var(--r-sm); font-size:12.5px; color:var(--tInk2); text-decoration:none;
    transition:background .15s; }
  .conv:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .conv.active { background:#fff; color:var(--tInk1); font-weight:600; box-shadow:var(--shadow-sm); }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;
    background:var(--surface-0); }
  .titlebar { height:46px; flex-shrink:0; display:flex; align-items:center; padding:0 18px; }
  .titlebar .app-title { position:absolute; left:50%; transform:translateX(-50%);
    font-size:14px; font-weight:600; color:var(--tInk2); }
  .titlebar .sp { flex:1; }
  .btn-main { display:inline-flex; align-items:center; height:32px; padding:0 16px;
    border:0; border-radius:var(--r-sm); background:var(--tInk1); color:#fff;
    font-size:12px; font-weight:600; cursor:pointer; text-decoration:none;
    transition:background .15s; }
  .btn-main:hover { background:#2A303B; }

  .scroll { flex:1; overflow-y:auto; }
  .scroll::-webkit-scrollbar { width:0; }
  .inner { width:min(760px, 100% - 80px); margin:0 auto; padding:20px 0 40px; }

  .page-head { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; }
  .page-title { font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .page-sub { font-size:14px; color:var(--tInk3); }

  /* 筛选栏 */
  .filters { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .filters .grow { flex:1; }
  .search { display:flex; align-items:center; gap:7px; height:34px; padding:0 13px;
    background:var(--surface-1); border-radius:var(--r-pill);
    color:var(--tInk3); min-width:180px; }
  .search input { border:0; background:transparent; outline:none; font-family:inherit;
    font-size:13px; color:var(--tInk1); width:100%; }
  .search input::placeholder { color:var(--tInk3); }

  /* 错题卡 */
  .mk { display:flex; gap:14px; background:var(--tCardBg); border:1px solid var(--tBorder);
    border-radius:var(--r-md); box-shadow:var(--shadow-card);
    padding:15px 18px; margin-bottom:10px;
    transition:transform .15s ease, opacity .28s ease; }
  .mk:hover { transform:translateY(-1px); }
  .mk.leaving { opacity:0; transform:translateX(40px); }
  .mk .body { flex:1; min-width:0; }
  .mk .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .mk .q { font-size:14px; font-weight:600; line-height:1.5; }
  .mk .meta { display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap; }
  .mk .mastery { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--tInk3); }
  .mk .mastery .bar { width:64px; height:4px; border-radius:var(--r-pill);
    background:var(--tBorder); overflow:hidden; }
  .mk .mastery .bar i { display:block; height:100%; background:var(--tPrimary);
    border-radius:var(--r-pill); }
  .mk .due { font-size:11px; color:var(--tInk3); }
  .mk .due.today { color:var(--tPrimary); font-weight:700; }
  .mk .acts { display:flex; flex-direction:column; align-items:flex-end; gap:6px;
    flex-shrink:0; }
  .mk .go { font-size:11px; font-weight:700; color:var(--tPrimary); text-decoration:none; }
  .mk .go:hover { text-decoration:underline; }
  .mk .icons { display:flex; gap:2px; margin-top:auto; }
  .icon-btn { width:28px; height:28px; border:0; border-radius:8px; background:transparent;
    color:var(--tInk3); cursor:pointer; display:grid; place-items:center;
    transition:all var(--dur-fast); }
  .icon-btn:hover { background:var(--surface-1); color:var(--tInk1); }
  .icon-btn.star.on { color:var(--tPrimary); }
  .icon-btn.del:hover { color:var(--tDanger); background:#FBE7E9; }

  /* 底部提示条 */
  .foot-tip { display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:18px; padding:12px; border-radius:var(--r-md);
    background:var(--surface-1); font-size:12px; color:var(--tInk3); }
  .foot-tip b { color:var(--tPrimary); font-weight:700; }
</style>
</head>
<body>
<div class="app-window">
  <aside class="sidebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <a class="back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      返回首页
    </a>
    <div class="side-scroll">
      <div class="group-label">学习</div>
      <a class="conv" href="plan.html">学习计划</a>
      <div class="conv active">错题本</div>
      <a class="conv" href="lib.html">知识库</a>
      <a class="conv" href="map.html">知识地图</a>
      <a class="conv" href="report.html">她的周报</a>
            <a class="conv" href="memory.html">她的记忆</a>
      <div class="group-label">互联</div>
      <a class="conv" href="drop.html">设备互联</a>
    </div>
  </aside>

  <section class="main">
    <div class="titlebar">
      <span class="app-title">错题本</span>
      <span class="sp"></span>
      <a class="btn-main" href="review.html">开始复习</a>
    </div>

    <div class="scroll"><div class="inner">
      <div class="page-head">
        <div class="page-title">错题本</div>
        <div class="page-sub"><b id="dueCount" style="color:var(--tPrimary)">23</b> 道待复习 · 已消灭 312 道</div>
      </div>

      <div class="filters">
        <div class="np-seg" id="segSubject">
          <button class="on" data-v="all">全部</button>
          <button data-v="数学">数学</button>
          <button data-v="英语">英语</button>
          <button data-v="操作系统">操作系统</button>
        </div>
        <div class="np-seg" id="segStatus">
          <button class="on" data-v="all">待复习</button>
          <button data-v="mastered">已掌握</button>
          <button data-v="starred">已收藏</button>
        </div>
        <span class="grow"></span>
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" placeholder="搜索题干或错因…">
        </div>
      </div>

      <div id="list"></div>

      <div class="np-empty" id="emptyBox" style="display:none">
        <div class="ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <div class="t">这个筛选下没有错题</div>
        <div class="d">她替你开心，错题都消灭啦</div>
      </div>

      <div class="foot-tip">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--tPrimary)"><path d="M12 22a7 7 0 0 1-7-7c0-2 .8-3.6 1.7-5C8 12 9 13.5 10.5 14c-1-2.5-.5-5 1.5-8 1 4 6 5.5 6 10a7 7 0 0 1-7 7z"/></svg>
        她会在最佳复习时机提醒你 · <b>间隔重复 SM-2</b>
      </div>
    </div></div>
  </section>
</div>

<script>
  const starSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17l-5.7 3 1.2-6.3L2.8 9.3l6.4-.8z"/></svg>';
  const starSvgLine = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17l-5.7 3 1.2-6.3L2.8 9.3l6.4-.8z"/></svg>';
  const trashSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>';

  const items = [
    { subj:"数学",     q:"lim(x→0) sinx/x 的值是多少？总记成 0。", reason:"概念记反", mastery:2, due:"今天到期", today:true,  status:"todo", starred:true  },
    { subj:"操作系统", q:"进程和线程，哪个是资源分配的最小单位？", reason:"概念混淆", mastery:1, due:"今天到期", today:true,  status:"todo", starred:false },
    { subj:"英语",     q:"定语从句里什么时候只能用 that 不能用 which？", reason:"关系词误用", mastery:3, due:"今天到期", today:true,  status:"todo", starred:false },
    { subj:"数学",     q:"复合函数求导：d/dx sin(x²)，链式法则漏了内层导数。", reason:"步骤遗漏", mastery:2, due:"明天",      today:false, status:"todo", starred:false },
    { subj:"英语",     q:"although 和 though 前面能加 even 吗？even although 对不对？", reason:"搭配记错", mastery:4, due:"8月31日",  today:false, status:"todo", starred:true  },
    { subj:"操作系统", q:"死锁的四个必要条件，写漏了「循环等待」。", reason:"要点遗漏", mastery:2, due:"9月1日",   today:false, status:"todo", starred:false },
    { subj:"数学",     q:"分部积分 ∫x·eˣdx，u 和 dv 选反了，越积越复杂。", reason:"方法选错", mastery:5, due:"已掌握",   today:false, status:"mastered", starred:false },
    { subj:"英语",     q:"虚拟语气 If I were… 的 were 误写成 was（正式文体）。", reason:"时态误判", mastery:5, due:"已掌握",   today:false, status:"mastered", starred:true  },
  ];

  let curSubj = "all", curStatus = "all", keyword = "";
  const list = document.getElementById("list");
  const emptyBox = document.getElementById("emptyBox");

  function badgeClass(subj) {
    return subj === "数学" ? "" : subj === "英语" ? "amber" : "gray";
  }

  function render() {
    list.innerHTML = "";
    const shown = items.filter(it =>
      (curSubj === "all" || it.subj === curSubj) &&
      (curStatus === "all"
        ? it.status === "todo"
        : curStatus === "mastered"
          ? it.status === "mastered"
          : it.starred) &&
      (!keyword || it.q.includes(keyword) || it.reason.includes(keyword))
    );
    emptyBox.style.display = shown.length ? "none" : "flex";

    shown.forEach(it => {
      const el = document.createElement("div");
      el.className = "mk";
      el.innerHTML = `
        <div class="body">
          <div class="row1">
            <span class="np-badge ${badgeClass(it.subj)}">${it.subj}</span>
            <span class="np-badge red">${it.reason}</span>
          </div>
          <div class="q">${it.q}</div>
          <div class="meta">
            <span class="mastery">掌握度
              <span class="bar"><i style="width:${it.mastery / 5 * 100}%"></i></span>
              ${it.mastery}/5
            </span>
            <span class="due${it.today ? " today" : ""}">${it.due}</span>
          </div>
        </div>
        <div class="acts">
          <a class="go" href="review.html">立即复习 →</a>
          <div class="icons">
            <button class="icon-btn star${it.starred ? " on" : ""}" data-tip="收藏">${it.starred ? starSvg : starSvgLine}</button>
            <button class="icon-btn del" data-tip="删除">${trashSvg}</button>
          </div>
        </div>`;
      el.querySelector(".star").addEventListener("click", e => {
        it.starred = !it.starred;
        const b = e.currentTarget;
        b.classList.toggle("on", it.starred);
        b.innerHTML = it.starred ? starSvg : starSvgLine;
        if (curStatus === "starred") {
          el.classList.add("leaving");
          setTimeout(() => { el.remove(); checkEmpty(); }, 280);
        }
      });
      el.querySelector(".del").addEventListener("click", () => {
        el.classList.add("leaving");
        setTimeout(() => {
          items.splice(items.indexOf(it), 1);
          el.remove(); checkEmpty();
        }, 280);
      });
      list.appendChild(el);
    });
  }

  function checkEmpty() {
    emptyBox.style.display = list.children.length ? "none" : "flex";
  }

  function bindSeg(id, cb) {
    document.getElementById(id).addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      e.currentTarget.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      cb(b.dataset.v);
      render();
    });
  }
  bindSeg("segSubject", v => curSubj = v);
  bindSeg("segStatus",  v => curStatus = v);
  document.getElementById("searchInput").addEventListener("input", e => {
    keyword = e.target.value.trim(); render();
  });

  render();
</script>
<script src="assets/np-her.js"></script>
<script>
if (window.NP) {
  const el = document.getElementById('dueCount');
  if (el) el.textContent = NP.get().mistakesDue;
}
</script>
</body>
</html>
