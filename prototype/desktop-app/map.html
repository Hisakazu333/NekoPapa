<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 知识地图</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/np-accent.js"></script>
<script src="assets/np-state.js"></script>
<style>
  :root {
    --tPageBg:#F5F7FA; --tCardBg:#FFFFFF; --tInk1:#181C23; --tInk2:#4E5763; --tInk3:#7A8492;
    --tBorder:#E1E7EF; --tPrimary:#E06B97; --tPrimarySoft:#F8DDE7;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --shadow-card:0 2px 10px rgba(24,28,35,0.06);
    --font:-apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased;
    background: #EDF0F4;
    display:grid; place-items:center;
  }
  button { font-family:inherit; }
  .app-window {
    width:min(1280px,92vw); height:min(830px,88vh);
    background:var(--surface-0); border-radius:16px;
    border:1px solid rgba(24,28,35,.08);
    box-shadow:var(--shadow-window);
    display:flex; overflow:hidden;
  }
  .sidebar { width:216px; flex-shrink:0; background:var(--surface-1);
    border-right:1px solid var(--tBorder); display:flex; flex-direction:column; }
  .traffic { display:flex; gap:8px; padding:14px 16px 12px; }
  .traffic span.dot { width:12px; height:12px; border-radius:50%; }
  .traffic .r{background:#FF5F57} .traffic .y{background:#FEBC2E} .traffic .g{background:#28C840}
  .back-link { display:flex; align-items:center; gap:6px; margin:0 14px 8px;
    height:28px; padding:0 10px; border-radius:var(--r-sm);
    color:var(--tInk2); font-size:12.5px; font-weight:500; text-decoration:none; }
  .back-link:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .side-scroll { flex:1; overflow-y:auto; padding:4px 16px 12px; }
  .group-label { font-size:10px; font-weight:600; letter-spacing:.09em; color:var(--tInk3); padding:14px 12px 5px; }
  .conv { display:flex; align-items:center; height:28px; padding:0 10px; margin:1px 0;
    border-radius:var(--r-sm); font-size:12.5px; color:var(--tInk2); text-decoration:none;
    transition:background .15s; }
  .conv:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .conv.active { background:#fff; color:var(--tInk1); font-weight:600; box-shadow:var(--shadow-sm); }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;
    background:var(--surface-0); }
  .titlebar { height:46px; flex-shrink:0; display:flex; align-items:center; padding:0 18px; position:relative; }
  .titlebar .app-title { position:absolute; left:50%; transform:translateX(-50%);
    font-size:14px; font-weight:600; color:var(--tInk2); }

  .scroll { flex:1; overflow-y:auto; }
  .scroll::-webkit-scrollbar { width:0; }
  .inner { width:min(1020px, 100% - 64px); margin:0 auto; padding:20px 0 40px; }

  .page-head { display:flex; align-items:flex-end; gap:14px; margin-bottom:18px; }
  .page-title { font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .page-sub { font-size:14px; color:var(--tInk3); padding-bottom:3px; }

  /* 图例 */
  .legend { margin-left:auto; display:flex; gap:14px; align-items:center; padding-bottom:5px; }
  .legend .li { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--tInk2); }
  .legend .sw { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .legend .sw.mastered { background:var(--tPrimary); }
  .legend .sw.learning { background:#fff; border:2px solid var(--tPrimary); }
  .legend .sw.todo { background:var(--surface-1); border:1px solid var(--tBorder); }
  .legend .sw.weak { background:#fff; border:2px solid var(--tWarning); }

  /* 地图画布 */
  .map-wrap { position:relative; height:560px; margin-bottom:20px;
    background:
      var(--surface-2);
    border:1px solid var(--tBorder); border-radius:var(--r-lg); box-shadow:var(--shadow-sm);
    overflow:hidden; }
  .map-svg { position:absolute; inset:0; width:100%; height:100%; }
  .map-svg line { stroke:var(--tBorder); stroke-width:1.5; }
  .map-svg line.done { stroke:var(--tPrimarySoft); stroke-width:2; }

  .node { position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border-radius:var(--r-pill); cursor:pointer; text-align:center;
    transition:transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out);
    user-select:none; }
  .node:hover { transform:translate(-50%,-50%) scale(1.07); z-index:30; }
  .node .n-name { font-weight:700; line-height:1.2; white-space:nowrap; }
  .node .n-meta { font-size:10px; font-weight:500; opacity:.85; line-height:1; }

  .node.lg { padding:14px 24px; } .node.lg .n-name { font-size:15px; }
  .node.md { padding:10px 18px; } .node.md .n-name { font-size:13px; }
  .node.sm { padding:8px 14px; }  .node.sm .n-name { font-size:12px; }

  .node.center { padding:20px 30px; z-index:10;
    background:var(--tPrimary);
    color:#FFF9FB; box-shadow:0 8px 28px rgba(224,107,151,.38); }
  .node.center .n-name { font-size:17px; }
  .node.center .n-meta { opacity:.9; }

  .node.mastered { background:var(--tPrimary); color:#FFF9FB; box-shadow:var(--shadow-sm); }
  .node.learning { background:#fff; color:var(--tPrimary);
    border:1.5px solid var(--tPrimary); animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow:0 0 0 0 rgba(224,107,151,.30), var(--shadow-sm); }
    50%     { box-shadow:0 0 0 9px rgba(224,107,151,.06), var(--shadow-sm); }
  }
  .node.todo { background:var(--surface-1); color:var(--tInk3); border:1px solid var(--tBorder); }
  .node.todo .n-name { font-weight:600; }
  .node.weak { background:#fff; color:var(--tInk1); border:1.5px solid var(--tWarning);
    box-shadow:var(--shadow-sm); }
  .node.weak .n-meta { color:var(--tWarning); }

  .corner-badge { position:absolute; top:-9px; right:-6px; padding:2px 7px;
    border-radius:var(--r-pill); background:#FBF0DC; color:var(--tWarning);
    border:1px solid var(--tWarning); font-size:9px; font-weight:700; line-height:1.3; }
  .cur-badge { position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    padding:2px 8px; border-radius:var(--r-pill);
    background:var(--tPrimary); color:#FFF9FB; font-size:9px; font-weight:700; line-height:1.3;
    box-shadow:0 2px 6px rgba(224,107,151,.4); white-space:nowrap; }

  /* Tooltip 卡（L3 悬浮层） */
  .tip { position:absolute; z-index:50; width:236px; padding:14px 16px;
    background:var(--surface-3); border:1px solid var(--tBorder);
    border-radius:var(--r-md); box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transform:translateY(4px);
    transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .tip.show { opacity:1; pointer-events:auto; transform:translateY(0); }
  .tip .t-name { font-size:14px; font-weight:700; margin-bottom:2px; }
  .tip .t-state { font-size:11px; color:var(--tInk3); margin-bottom:8px; }
  .tip .t-state b { color:var(--tPrimary); }
  .tip .t-say { font-size:12px; color:var(--tInk2); line-height:1.55;
    background:var(--tPrimarySoft); border-radius:var(--r-sm);
    padding:8px 10px; margin-bottom:10px; }
  .tip .t-say::before { content:"她说 · "; font-weight:700; color:var(--tPrimary); }
  .tip .np-btn { width:100%; height:30px; font-size:12px; }

  /* 她的建议 */
  .advice { display:flex; gap:14px; align-items:flex-start;
    background:var(--surface-2); border:1px solid var(--tBorder);
    border-left:3px solid var(--tPrimary);
    border-radius:var(--r-md); box-shadow:var(--shadow-sm); padding:16px 20px; }
  .advice .a-ic { width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--tPrimarySoft); display:grid; place-items:center; color:var(--tPrimary);
    font-size:15px; font-weight:700; }
  .advice .a-t { font-size:13px; font-weight:700; margin-bottom:3px; }
  .advice .a-d { font-size:13px; color:var(--tInk2); line-height:1.6; }
  .advice .np-btn { margin-left:auto; flex-shrink:0; }
</style>
</head>
<body>
<div class="app-window">
  <aside class="sidebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <a class="back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      返回首页
    </a>
    <div class="side-scroll">
      <div class="group-label">学习</div>
      <a class="conv" href="plan.html">学习计划</a>
      <a class="conv" href="mistakes.html">错题本</a>
      <a class="conv" href="lib.html">知识库</a>
      <div class="conv active">知识地图</div>
      <a class="conv" href="report.html">她的周报</a>
            <a class="conv" href="memory.html">她的记忆</a>
      <div class="group-label">互联</div>
      <a class="conv" href="drop.html">设备互联</a>
    </div>
  </aside>

  <section class="main">
    <div class="titlebar">
      <span class="app-title">知识地图</span>
    </div>

    <div class="scroll"><div class="inner">
      <div class="page-head">
        <div class="page-title">知识地图</div>
        <div class="page-sub">操作系统 · 第 4 章 · 她说：你这章比上周扎实多了</div>
        <div class="legend">
          <span class="li"><span class="sw mastered"></span>已掌握</span>
          <span class="li"><span class="sw learning"></span>学习中</span>
          <span class="li"><span class="sw todo"></span>未开始</span>
          <span class="li"><span class="sw weak"></span>薄弱</span>
        </div>
      </div>

      <div class="map-wrap" id="mapWrap">
        <svg class="map-svg" id="mapSvg"></svg>
        <div class="tip" id="tip"></div>
      </div>

      <div class="advice">
        <span class="a-ic">她</span>
        <div>
          <div class="a-t">她的建议 · 下一步</div>
          <div class="a-d">先把「资源共享与竞争」收尾，锁就学起来很快。死锁先别碰，它要等互斥锁和信号量都就位之后才讲得通。另外 IPC 上次测验错了两道，这周找个 10 分钟过一眼。</div>
        </div>
        <a class="np-btn primary" href="learn-flow.html" style="text-decoration:none">继续学习</a>
      </div>
    </div></div>
  </section>
</div>

<script>
  const wrap = document.getElementById("mapWrap");
  const svg = document.getElementById("mapSvg");
  const tip = document.getElementById("tip");

  const nodes = [
    { name:"进程与线程", status:"center", size:"center", angle:null,
      meta:"第 4 章 · 10 个知识点" },
    { name:"进程概念", status:"mastered", size:"lg", angle:90, mastery:"92%",
      time:"最近复习 · 3 天前", say:"概念这块你很稳，我放心。", btn:"去复习", href:"review.html" },
    { name:"线程概念", status:"mastered", size:"lg", angle:54, mastery:"85%",
      time:"最近学习 · 昨天", say:"线程这块比上周扎实多了，夸夸你。", btn:"去复习", href:"review.html" },
    { name:"线程调度", status:"learning", size:"md", angle:18, mastery:"46%",
      time:"最近学习 · 今天", say:"调度算法刚开了个头，明天继续，别断。", btn:"进入学习", href:"learn-flow.html" },
    { name:"资源共享与竞争", status:"learning", size:"lg", angle:-18, mastery:"62%", current:true,
      time:"正在学 · 还剩 1 节", say:"就差这一节收尾了，锁就在前面等你。", btn:"继续学习", href:"learn-flow.html" },
    { name:"互斥锁", status:"todo", size:"md", angle:-54, mastery:"未开始",
      time:"前置 · 资源共享与竞争", say:"学完竞争再来看锁，会顺很多。", btn:"进入学习", href:"learn-flow.html" },
    { name:"信号量", status:"todo", size:"md", angle:-90, mastery:"未开始",
      time:"前置 · 互斥锁", say:"信号量是锁的进阶，别急，一步步来。", btn:"进入学习", href:"learn-flow.html" },
    { name:"经典同步问题", status:"todo", size:"md", angle:-126, mastery:"未开始",
      time:"前置 · 信号量", say:"生产者与消费者在前方等你，很有意思的。", btn:"进入学习", href:"learn-flow.html" },
    { name:"死锁", status:"todo", size:"md", angle:-162, mastery:"未开始",
      time:"前置 · 互斥锁、信号量", say:"死锁还没碰，别急，先把锁学完。", btn:"进入学习", href:"learn-flow.html" },
    { name:"PCB", status:"mastered", size:"md", angle:162, mastery:"88%",
      time:"最近复习 · 5 天前", say:"PCB 的字段还记得吗？抽空过一眼。", btn:"去复习", href:"review.html" },
    { name:"进程间通信 IPC", status:"weak", size:"md", angle:126, mastery:"58%",
      time:"上次测验 · 4 天前 · 错 2 道", say:"IPC 上次错了两道，回去看看吧，不难的。", btn:"去复习", href:"review.html" },
  ];

  const CX = 50, CY = 50, RX = 36, RY = 36;
  let pinned = null;

  function layout() {
    const W = wrap.clientWidth, H = wrap.clientHeight;
    svg.innerHTML = "";
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    wrap.querySelectorAll(".node").forEach(n => n.remove());

    const centerPx = { x: W * CX / 100, y: H * CY / 100 };

    nodes.forEach(n => {
      let px;
      if (n.status === "center") px = centerPx;
      else {
        const rad = n.angle * Math.PI / 180;
        px = { x: W * (CX + RX * Math.cos(rad)) / 100, y: H * (CY - RY * Math.sin(rad)) / 100 };
      }
      n.px = px;

      if (n.status !== "center") {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", centerPx.x); line.setAttribute("y1", centerPx.y);
        line.setAttribute("x2", px.x); line.setAttribute("y2", px.y);
        if (n.status === "mastered") line.classList.add("done");
        svg.appendChild(line);
      }

      const el = document.createElement("div");
      el.className = `node ${n.status === "center" ? "center" : n.status + " " + n.size}`;
      el.style.left = px.x + "px";
      el.style.top = px.y + "px";
      const stateText = n.status === "center" ? n.meta
        : n.status === "mastered" ? `掌握 ${n.mastery}`
        : n.status === "learning" ? `掌握 ${n.mastery}`
        : n.status === "weak" ? `掌握 ${n.mastery}` : "未开始";
      el.innerHTML = `<span class="n-name">${n.name}</span><span class="n-meta">${stateText}</span>`;
      if (n.status === "weak") el.insertAdjacentHTML("beforeend", '<span class="corner-badge">薄弱</span>');
      if (n.current) el.insertAdjacentHTML("beforeend", '<span class="cur-badge">当前在学</span>');

      if (n.status !== "center") {
        el.addEventListener("mouseenter", () => showTip(n));
        el.addEventListener("mouseleave", () => { if (pinned !== n) hideTip(); });
        el.addEventListener("click", () => { pinned = (pinned === n) ? null : n; if (pinned) showTip(n); else hideTip(); });
      }
      wrap.appendChild(el);
    });
  }

  function showTip(n) {
    tip.innerHTML = `
      <div class="t-name">${n.name}</div>
      <div class="t-state">掌握度 <b>${n.mastery}</b> · ${n.time}</div>
      <div class="t-say">${n.say}</div>
      <a class="np-btn ${n.status === "todo" ? "ghost" : "primary"}" href="${n.href}" style="text-decoration:none">${n.btn} →</a>`;
    const W = wrap.clientWidth;
    let x = n.px.x, below = n.px.y < 220;
    tip.style.left = "0px"; tip.style.top = "0px";
    tip.classList.add("show");
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    x = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, x));
    tip.style.left = (x - tw / 2) + "px";
    tip.style.top = below ? (n.px.y + 26) + "px" : (n.px.y - th - 26) + "px";
  }
  function hideTip() { tip.classList.remove("show"); }

  wrap.addEventListener("mouseleave", () => { if (!pinned) hideTip(); });
  document.addEventListener("click", e => {
    if (!e.target.closest(".node") && !e.target.closest(".tip")) { pinned = null; hideTip(); }
  });
  window.addEventListener("resize", layout);
  layout();
</script>
</body>
</html>
