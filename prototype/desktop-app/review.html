<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 错题复习</title>
<link rel="stylesheet" href="assets/proto.css">
<style>
  :root {
    --tPageBg:#F5F7FA; --tCardBg:#FFFFFF; --tInk1:#181C23; --tInk2:#4E5763; --tInk3:#7A8492;
    --tBorder:#E1E7EF; --tPrimary:#E06B97; --tPrimarySoft:#F8DDE7;
    --tDanger:#E0646E; --tSuccess:#4FAF73;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --shadow-card:0 2px 10px rgba(24,28,35,0.06);
    --font:-apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(224,107,151,.14), transparent 60%),
      radial-gradient(1000px 700px at 105% 110%, rgba(122,132,146,.16), transparent 60%),
      linear-gradient(150deg, #FBF7F9 0%, #EFF2F8 55%, #F6F4F2 100%);
    display:grid; place-items:center;
  }
  button { font-family:inherit; }
  .app-window {
    width:min(1280px,92vw); height:min(830px,88vh);
    background:var(--surface-0); border-radius:16px;
    border:1px solid rgba(24,28,35,.08);
    box-shadow:0 12px 32px rgba(24,28,35,.10), 0 48px 120px rgba(24,28,35,.16);
    display:flex; overflow:hidden;
  }
  .sidebar { width:248px; flex-shrink:0; background:var(--surface-1);
    border-right:1px solid var(--tBorder); display:flex; flex-direction:column; }
  .traffic { display:flex; gap:8px; padding:14px 16px 12px; }
  .traffic span.dot { width:12px; height:12px; border-radius:50%; }
  .traffic .r{background:#FF5F57} .traffic .y{background:#FEBC2E} .traffic .g{background:#28C840}
  .back-link { display:flex; align-items:center; gap:8px; margin:0 16px 12px;
    height:36px; padding:0 12px; border-radius:var(--r-sm);
    color:var(--tInk2); font-size:14px; text-decoration:none; }
  .back-link:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .group-label { font-size:11px; color:var(--tInk3); padding:14px 12px 6px; }
  .side-scroll { flex:1; overflow-y:auto; padding:4px 16px 12px; }
  .conv { display:flex; align-items:center; height:32px; padding:0 12px;
    border-radius:var(--r-sm); font-size:14px; color:var(--tInk2); text-decoration:none; }
  .conv:hover { background:rgba(255,255,255,.65); color:var(--tInk1); }
  .conv.active { background:var(--tPrimarySoft); color:var(--tPrimary); font-weight:600; }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative;
    background:var(--surface-0); }
  .titlebar { height:46px; flex-shrink:0; display:flex; align-items:center; padding:0 18px; }
  .titlebar .app-title { position:absolute; left:50%; transform:translateX(-50%);
    font-size:14px; font-weight:600; color:var(--tInk2); }
  .titlebar .sp { flex:1; }
  .streak-pill { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px;
    border-radius:var(--r-pill); border:1px solid var(--tBorder);
    font-size:11px; color:var(--tInk2); }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 48px 5vh; }
  .progress-row { display:flex; align-items:center; gap:12px; margin-bottom:24px;
    font-size:11px; color:var(--tInk3); }
  .progress-row .bar { width:220px; height:5px; border-radius:var(--r-pill);
    background:var(--tBorder); overflow:hidden; }
  .progress-row .bar i { display:block; height:100%; width:8%;
    background:var(--tPrimary); border-radius:var(--r-pill); transition:width .4s ease; }

  /* 闪卡 */
  .card {
    width:min(600px,100%); min-height:300px;
    background:var(--tCardBg); border:1px solid var(--tBorder);
    border-radius:var(--r-lg); box-shadow:var(--shadow-md);
    padding:28px 32px; cursor:pointer; user-select:none;
    display:flex; flex-direction:column;
    transition:transform .18s ease, opacity .3s ease;
  }
  .card:hover { transform:translateY(-2px); }
  .card.gone { opacity:0; transform:translateX(40px) rotate(2deg); }
  .card .tag { display:inline-block; font-size:11px; font-weight:700; color:var(--tPrimary);
    background:var(--tPrimarySoft); padding:3px 10px; border-radius:var(--r-pill);
    width:fit-content; margin-bottom:14px; }
  .card .q { font-size:17px; font-weight:700; line-height:1.7; }
  .card .hint { font-size:11px; color:var(--tInk3); margin-top:auto; padding-top:20px; }
  .card .a { display:none; margin-top:14px; padding-top:14px;
    border-top:1px dashed var(--tBorder);
    font-size:14px; line-height:1.8; color:var(--tInk2); animation:rise .35s ease both; }
  .card.flipped .a { display:block; }
  .card.flipped .hint { display:none; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } }

  .rate-row { display:flex; gap:12px; margin-top:22px; height:40px; }
  .rate { height:40px; padding:0 22px; border-radius:var(--r-pill);
    font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--tBorder);
    background:var(--tCardBg); color:var(--tInk2); transition:all .18s; }
  .rate:hover { transform:translateY(-1px); }
  .rate.bad:hover { border-color:var(--tDanger); color:var(--tDanger); }
  .rate.good { background:var(--tPrimary); border-color:var(--tPrimary); color:#FFF9FB; }
  .rate.good:hover { filter:brightness(1.06); }

  /* 完成态 */
  .done-box { display:none; text-align:center; animation:rise .5s ease both; }
  .done-box .big { font-size:26px; font-weight:700; margin-bottom:8px; }
  .done-box .sub { font-size:14px; color:var(--tInk2); margin-bottom:22px; }
  .done-box .btn-main { height:40px; padding:0 24px; border:0; border-radius:var(--r-pill);
    background:var(--tPrimary); color:#FFF9FB; font-size:14px; font-weight:600; cursor:pointer; }

  .buddy { position:absolute; right:10px; bottom:0; width:190px; height:300px;
    pointer-events:auto; cursor:pointer; z-index:15; }
  .buddy canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="app-window">
  <aside class="sidebar">
    <div class="traffic"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <a class="back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      返回首页
    </a>
    <div class="side-scroll">
      <div class="group-label">学习</div>
      <a class="conv" href="plan.html">学习计划</a>
      <div class="conv active">错题本</div>
      <a class="conv" href="lib.html">知识库</a>
    </div>
  </aside>

  <section class="main">
    <div class="titlebar">
      <span class="app-title">错题复习</span>
      <span class="sp"></span>
      <div class="streak-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--tPrimary)"><path d="M12 22a7 7 0 0 1-7-7c0-2 .8-3.6 1.7-5C8 12 9 13.5 10.5 14c-1-2.5-.5-5 1.5-8 1 4 6 5.5 6 10a7 7 0 0 1-7 7z"/></svg>
        间隔重复 · SM-2
      </div>
    </div>

    <div class="stage">
      <div class="progress-row">
        第 <b id="curNum" style="color:var(--tInk1)">1</b> 题 / 今天复习 5 题
        <span class="bar"><i id="barFill"></i></span>
        已消灭 <b id="killed" style="color:var(--tSuccess)">0</b>
      </div>

      <div class="card" id="card">
        <span class="tag" id="cardTag">操作系统</span>
        <div class="q" id="cardQ">进程和线程，哪个是资源分配的最小单位？</div>
        <div class="a" id="cardA"><b>进程。</b>进程是资源分配的最小单位，线程是调度执行的最小单位。工厂（进程）拥有设备，工人（线程）只管干活。</div>
        <div class="hint">点击卡片翻面看答案</div>
      </div>

      <div class="rate-row" id="rateRow">
        <button class="rate bad" id="btnFuzzy">还模糊</button>
        <button class="rate good" id="btnGot">记住了</button>
      </div>

      <div class="done-box" id="doneBox">
        <div class="big">今天的复习完成啦</div>
        <div class="sub" id="doneSub">消灭 4 道 · 1 道明天再见</div>
        <button class="btn-main" onclick="location.href='index.html'">回到首页</button>
      </div>
    </div>

    <div class="buddy" id="buddy" title="点我一下"><canvas id="live2d"></canvas></div>
  </section>
</div>

<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/pixi-live2d-display-cubism4.min.js"></script>
<script>
  const cards = [
    { tag: "操作系统", q: "进程和线程，哪个是资源分配的最小单位？", a: "<b>进程。</b>进程是资源分配的最小单位，线程是调度执行的最小单位。工厂（进程）拥有设备，工人（线程）只管干活。" },
    { tag: "英语语法", q: "定语从句里，什么时候只能用 that 不能用 which？", a: "<b>先行词是不定代词、被最高级修饰、或既有人又有物时。</b>比如：all that… / the best that…" },
    { tag: "高数", q: "lim(x→0) sinx/x = ？", a: "<b>1。</b>重要极限之一。几何上用单位圆夹逼可得。" },
    { tag: "操作系统", q: "进程间通信有哪些方式？说两个。", a: "<b>管道、消息队列、共享内存、信号量、Socket。</b>共享内存最快，但要自己处理同步。" },
    { tag: "英语词汇", q: "「尽管」—— although 和 though 能换着用吗？", a: "<b>基本可以。</b>though 更口语，句首句中都能用；although 一般放句首。even though ✓，even although ✗。" },
  ];
  let cur = 0, killed = 0, fuzzy = 0;
  const card = document.getElementById("card");

  card.addEventListener("click", () => card.classList.toggle("flipped"));

  function next(got) {
    if (!card.classList.contains("flipped")) { card.classList.add("flipped"); return; }
    if (got) killed++; else fuzzy++;
    document.getElementById("killed").textContent = killed;
    card.classList.add("gone");
    setTimeout(() => {
      cur++;
      card.classList.remove("gone", "flipped");
      if (cur >= cards.length) {
        card.style.display = "none";
        document.getElementById("rateRow").style.display = "none";
        document.querySelector(".progress-row").style.display = "none";
        document.getElementById("doneSub").textContent = `消灭 ${killed} 道 · ${fuzzy} 道明天再见`;
        document.getElementById("doneBox").style.display = "block";
        return;
      }
      const c = cards[cur];
      document.getElementById("cardTag").textContent = c.tag;
      document.getElementById("cardQ").textContent = c.q;
      document.getElementById("cardA").innerHTML = c.a;
      document.getElementById("curNum").textContent = cur + 1;
      document.getElementById("barFill").style.width = ((cur + 1) / cards.length * 100) + "%";
    }, 280);
  }
  document.getElementById("btnGot").onclick = e => { e.stopPropagation(); next(true); };
  document.getElementById("btnFuzzy").onclick = e => { e.stopPropagation(); next(false); };

  (async () => {
    const wrap = document.getElementById("buddy");
    try {
      const canvas = document.getElementById("live2d");
      const app = new PIXI.Application({ view: canvas, transparent: true, autoStart: true,
        resizeTo: wrap, resolution: window.devicePixelRatio || 1, autoDensity: true });
      const model = await PIXI.live2d.Live2DModel.from(
        "../../assets/live2d/hiyori/hiyori_pro_t11.model3.json", { autoInteract: false });
      app.stage.addChild(model);
      const fit = () => {
        const w = wrap.clientWidth, h = wrap.clientHeight;
        const s = Math.min(w / model.internalModel.width, h / model.internalModel.height);
        model.scale.set(s);
        model.x = (w - model.width) / 2; model.y = h - model.height;
      };
      fit(); window.addEventListener("resize", fit);
      const idle = () => model.motion("Idle");
      idle(); setInterval(idle, 16000);
      wrap.addEventListener("click", () => model.motion("Tap"));
      window.addEventListener("pointermove", e => {
        const r = canvas.getBoundingClientRect();
        model.focus(e.clientX - r.left, e.clientY - r.top);
      });
    } catch (err) { console.warn("Live2D 未加载：", err); wrap.style.display = "none"; }
  })();
</script>
</body>
</html>
