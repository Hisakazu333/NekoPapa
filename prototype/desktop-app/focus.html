<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NekoPapa · 专注模式</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/np-accent.js"></script>
<script src="assets/np-state.js"></script>
<style>
  :root {
    --tPageBg:#F5F7FA; --tCardBg:#FFFFFF; --tInk1:#181C23; --tInk2:#4E5763; --tInk3:#7A8492;
    --tBorder:#E1E7EF; --tPrimary:#E06B97; --tPrimarySoft:#F8DDE7; --tSuccess:#4FAF73;
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
    --shadow-card:0 2px 10px rgba(24,28,35,0.06);
    --font:-apple-system, BlinkMacSystemFont, "HarmonyOS Sans SC", "PingFang SC", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased;
    background: #EDF0F4;
    display:grid; place-items:center;
  }
  button { font-family:inherit; }
  .app-window {
    width:min(1280px,92vw); height:min(830px,88vh);
    background:var(--surface-0); border-radius:16px;
    border:1px solid rgba(24,28,35,.08);
    box-shadow:0 12px 32px rgba(24,28,35,.10), 0 48px 120px rgba(24,28,35,.16);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .titlebar { height:46px; flex-shrink:0; display:flex; align-items:center; padding:0 18px; }
  .quit { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 14px;
    border:1px solid var(--tBorder); border-radius:8px; background:var(--tCardBg);
    color:var(--tInk2); font-size:11px; font-weight:600; cursor:pointer; }
  .quit:hover { border-color:var(--tPrimary); color:var(--tPrimary); }
  .mute-note { margin-left:auto; font-size:11px; color:var(--tInk3);
    display:inline-flex; align-items:center; gap:6px; }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; }
  .stage::before { content:""; position:absolute; left:50%; top:50%;
    width:560px; height:460px; transform:translate(-50%,-54%);
    
    pointer-events:none; }
  .stage > * { position:relative; z-index:1; }
  .f-goal { font-size:14px; color:var(--tInk3); letter-spacing:.1em; margin-bottom:14px; }
  .f-timer { font-size:96px; font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums;
    color:var(--tInk1); line-height:1; }
  .f-timer .sec { font-size:40px; color:var(--tInk3); }
  .f-ring { width:230px; height:6px; border-radius:var(--r-pill);
    background:var(--surface-1); overflow:hidden; margin:26px 0 30px;
    box-shadow:inset 0 1px 2px rgba(24,28,35,.05); }
  .f-ring i { display:block; height:100%; width:35%;
    background:var(--tPrimary);
    border-radius:var(--r-pill); transition:width 1s linear; }
  .f-actions { display:flex; gap:12px; }
  .f-btn { height:40px; padding:0 24px; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; }
  .f-btn.p { border:0; background:var(--tInk1); color:#fff; transition:background .15s; }
  .f-btn.p:hover { background:#2A303B; }
  .f-btn.g { border:1px solid var(--tBorder); background:var(--tCardBg); color:var(--tInk2); }
  .f-btn.g:hover { border-color:var(--tInk3); }
  .f-note { margin-top:22px; font-size:11px; color:var(--tInk3); }

  .buddy { position:absolute; right:16px; bottom:0; width:230px; height:360px;
    pointer-events:auto; cursor:pointer; z-index:15; }
  .buddy canvas { width:100%; height:100%; display:block; }
  .buddy-say { position:absolute; right:190px; bottom:290px; width:190px;
    background:var(--tCardBg); border:1px solid var(--tBorder);
    border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);
    box-shadow:var(--shadow-md); padding:12px 16px;
    font-size:14px; line-height:1.7; z-index:14; }
  .buddy-say .who { font-size:11px; font-weight:700; letter-spacing:.14em;
    color:var(--tPrimary); margin-bottom:4px; }
</style>
</head>
<body>
<div class="app-window">
  <div class="titlebar">
    <button class="quit" onclick="location.href='index.html'">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      结束专注
    </button>
    <span class="mute-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10.3 21a2 2 0 0 0 3.4 0"/><path d="m3 3 18 18"/></svg>
      通知已静音
    </span>
  </div>

  <div class="stage">
    <div class="f-goal">正在专注 · 操作系统 · 进程与线程</div>
    <div class="f-timer"><span id="mm">24</span>:<span id="ss" class="sec">47</span></div>
    <div class="f-ring"><i id="ringFill"></i></div>
    <div class="f-actions">
      <button class="f-btn g" id="pauseBtn">暂停一下</button>
      <button class="f-btn p" id="finishBtn">提前完成</button>
    </div>
    <div class="f-note">25 分钟番茄钟 · 结束后她陪你休息 5 分钟</div>
  </div>

  <div class="buddy-say" id="buddySay">
    <div class="who">NEKO</div>
    <div id="buddyLine">我不打扰你，就坐在这儿陪你。</div>
  </div>
  <div class="buddy" id="buddy"><canvas id="live2d"></canvas></div>
</div>

<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/pixi-live2d-display-cubism4.min.js"></script>
<script>
  const TOTAL = 25 * 60;
  let left = TOTAL - 13; // 演示从 24:47 开始
  let paused = false;
  setInterval(() => {
    if (paused || left <= 0) return;
    left--;
    document.getElementById("mm").textContent = String(Math.floor(left / 60)).padStart(2, "0");
    document.getElementById("ss").textContent = String(left % 60).padStart(2, "0");
    document.getElementById("ringFill").style.width = ((1 - left / TOTAL) * 100) + "%";
  }, 1000);
  document.getElementById("pauseBtn").onclick = e => {
    paused = !paused;
    e.target.textContent = paused ? "继续" : "暂停一下";
  };
  document.getElementById("finishBtn").onclick = () => {
    document.getElementById("buddyLine").textContent = "提前完成了？厉害！走吧，休息 5 分钟。";
  };

  (async () => {
    const wrap = document.getElementById("buddy");
    try {
      const canvas = document.getElementById("live2d");
      const app = new PIXI.Application({ view: canvas, transparent: true, autoStart: true,
        resizeTo: wrap, resolution: window.devicePixelRatio || 1, autoDensity: true });
      const model = await PIXI.live2d.Live2DModel.from(
        "../../assets/live2d/hiyori/hiyori_pro_t11.model3.json", { autoInteract: false });
      app.stage.addChild(model);
      const fit = () => {
        const w = wrap.clientWidth, h = wrap.clientHeight;
        const s = Math.min(w / model.internalModel.width, h / model.internalModel.height);
        model.scale.set(s);
        model.x = (w - model.width) / 2; model.y = h - model.height;
      };
      fit(); window.addEventListener("resize", fit);
      const idle = () => model.motion("Idle");
      idle(); setInterval(idle, 16000);
      wrap.addEventListener("click", () => model.motion("Tap"));
      window.addEventListener("pointermove", e => {
        const r = canvas.getBoundingClientRect();
        model.focus(e.clientX - r.left, e.clientY - r.top);
      });
    } catch (err) { console.warn("Live2D 未加载：", err); wrap.style.display = "none"; document.getElementById("buddySay").style.display = "none"; }
  })();
</script>
<script src="assets/np-her.js"></script>
</body>
</html>
