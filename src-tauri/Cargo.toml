[package]
name = "nekopapa"
version = "0.1.0"
description = "NekoPapa desktop workspace"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nekopapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (Window::add_child) for the built-in browser.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
# The desktop chat runtime's model requests (model_proxy.rs): streamed replies over TLS.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls", "http2"] }
# API keys typed in 设置 → 模型与 API live in the system keychain (credential_store.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
