[package]
name = "nekopapa"
version = "0.1.0"
description = "NekoPapa desktop workspace"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nekopapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews (Window::add_child) for the built-in browser.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
percent-encoding = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
portable-pty = "0.9"
# The desktop chat runtime's model requests (model_proxy.rs): streamed replies over TLS.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls", "http2", "json", "multipart"] }
# API keys typed in 设置 → 模型与 API live in the system keychain (credential_store.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
# search_files: regular expressions and path filters (project_files.rs).
regex = "1"
# The local memory service (memory_service.rs): per-space tokens and waiting for it to start.
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }
